[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "teacher"
version = "0.1.0"
description = "Turn timestamped lectures into structured lessons with a resumable LLM graph."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Giovanni Gravili" }]
dependencies = [
  "aiosqlite>=0.20",
  "httpx>=0.28",
  "langchain-core>=1.0",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "models-provider @ git+https://github.com/ghovax/models-provider.git@24c3340f2d54fc143618073dba7efd99cfa57e6b",
  "lxml>=5.3",
  "pydantic>=2.11",
  "pypdfium2>=4.30",
  "segno>=1.6",
  "structlog>=25.1",
]

[project.optional-dependencies]
modal = ["modal>=1.0"]

[dependency-groups]
dev = [
  "basedpyright>=1.23,<2",
  "lxml-stubs>=0.5",
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.14,<0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/teacher"]

[tool.hatch.build]
include = ["src/teacher/**/*.py", "src/teacher/**/*.md", "src/teacher/**/*.template"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC", "RUF006", "RUF012", "RUF018", "RUF019"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.13"
