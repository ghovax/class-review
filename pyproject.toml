[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "teacher"
version = "0.1.0"
description = "Turn timestamped lectures into structured lessons with ordered lesson writing."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Giovanni Gravili" }]
dependencies = [
  "babel>=2.17",
  "langchain-core>=1.0",
  "pyyaml>=6.0",
  "wenmode>=0.14.1",
  "models-provider @ git+https://github.com/ghovax/models-provider.git@dda75008b3fbdda608233829c136eb0aeb805ab5",
  "lxml>=5.3",
  "pydantic>=2.11",
  "pymupdf>=1.24",
  "segno>=1.6",
  "structlog>=25.1",
]

[project.optional-dependencies]
modal = ["modal>=1.0"]

[dependency-groups]
dev = [
  "basedpyright>=1.23,<2",
  "lxml-stubs>=0.5",
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.14,<0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/teacher"]

[tool.hatch.build]
include = ["src/teacher/**/*.py", "src/teacher/**/*.md", "src/teacher/**/*.template", "src/teacher/**/*.css"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC", "RUF006", "RUF012", "RUF018", "RUF019"]

[tool.basedpyright]
include = ["src"]
exclude = ["src/teacher/modal_apps"]
typeCheckingMode = "basic"
pythonVersion = "3.13"
